# Supported upstream R versions. There is NO tamatebako source factory
# for R yet (the census increment builds from pristine upstream): the
# legs download CRAN's published release tarballs directly, so THIS file
# is the source-pin trust anchor — the sha256 recorded beside each url,
# verified at fetch time (a mismatch is a hard error, never a refetch).
# The grammar mirrors tamatebako/ruby's versions.yml (the source-factory
# shape this factory will flow from if a tamatebako/R source factory ever
# opens).
#
# contract.yml's r.catalog selects which of these pinned versions the
# matrix builds; scripts/check_contract.rb locks the two (a catalog
# version with no pin, or a pin the catalog never builds, is a config
# bug).
---
versions:
  "4.6.2":
    url: https://cran.r-project.org/src/base/R-4/R-4.6.2.tar.gz
    sha256: c297040f6392b1dac6e5c0eb398422cfdaedf540ae2205edb9ad0d10cb10ee00
    line: "4.6"

# The factory-built dependency pins (the deps stage, docs/build-chain.md):
# upstream sources this factory builds ITSELF because no honest artifact
# can consume the distro's. R 4.6 requires libcurl with https support
# (configure hard-fails without it — there is no --without-libcurl), and
# the distro libcurl drags an LGPL/GPL-encumbered dynamic closure
# (libidn2/librtmp/libssh/...) a bare system neither carries nor the
# license allows statically. So the factory builds a MINIMAL static
# libcurl (http/https/ftp only, nothing else) and R's configure consumes
# its curl-config. curl 8.23 in turn requires OpenSSL >= 3.0, and the
# focal toolchain image carries only the EOL OpenSSL 1.1.1 — so the deps
# stage also builds OpenSSL 3.5 (the LTS line, Apache-2.0: license-clean
# for static linking, unlike the LGPL TLS stacks) static, providers
# built in (no runtime dlopen — a module build would look for its
# providers on the BUILD machine's paths).
# zlib joins them for a different reason: R links -lz into internet.so,
# a SHARED object, and the focal toolchain's static libz.a is compiled
# without -fPIC (ld rejects its relocations in a shared link) — so the
# deps stage builds zlib itself, -fPIC throughout, and the -L pin
# resolves every -lz (libR's too) against it.
# Same trust-anchor grammar as the versions above: the sha256 is pinned
# beside the url and verified at fetch time (a mismatch is a hard
# error).
deps:
  zlib:
    url: https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.gz
    sha256: 02dd159783677a749c04adbdd02b55b8a2bcc7e054f51b76b549199a916ad584
  openssl:
    url: https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
    sha256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
  curl:
    url: https://curl.se/download/curl-8.23.0.tar.gz
    sha256: e3de77cfa6367083c776a26647fc9f633b538c06c3baa73d931a252ac8f72b49
  # The deps stage's second tier (the macOS legs): R 4.6 dropped its
  # bundled xz and pcre2, and the macOS SDK ships their .tbd stubs
  # WITHOUT the pcre2.h/lzma.h headers, so the system dylibs are
  # unprobe-able (and a Homebrew find is tebako-runtime-python#80's leak
  # class). The macOS legs build both from pinned source, -fPIC
  # throughout; the linux legs take them from the toolchain's -dev
  # packages instead (apt on gnu, apk on musl — the in-leg provisioning,
  # proven to reach only R.bin's link).
  pcre2:
    url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
    sha256: 86b9cb0aa3bcb7994faa88018292bc704cdbb708e785f7c74352ff6ea7d3175b
  xz:
    url: https://github.com/tukaani-project/xz/releases/download/v5.8.1/xz-5.8.1.tar.gz
    sha256: 507825b599356c10dca1cd720c9d0d0c9d5400b9de300af00e4d1ea150795543
