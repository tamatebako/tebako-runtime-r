# JSON Schema (draft 2020-12) for contract.yml — the bootstrap <-> runtime
# contract version, the tpkg-builder container line (tag + immutable
# digests), the link-unit release pin, and the R version catalog.
# Modeled on tebako-runtime-php's schema/contract.schema.yml (itself
# tebako-runtime-python's).
$schema: "https://json-schema.org/draft/2020-12/schema"
title: tebako-runtime-r bootstrap <-> runtime contract
type: object
required: [contract_version, container_version, container_digests, link_unit_release, macos_deployment_target, release_tooling, r]
additionalProperties: false
properties:
  contract_version:
    type: integer
    # This factory has no contract-1 era: R runtimes are image-era
    # (the spec-17 driver) from the first build.
    minimum: 2
  container_version:
    type: string
    # tpkg-builder tag grammar: the moving family tag (v1) or a dated
    # immutable tag (v1.2026.09.01). The immutable side per (container x
    # arch) is container_digests.
    pattern: '^v\d+(\.\d{4}\.\d{2}\.\d{2})?$'
    description: the tpkg-builder container tag line the POSIX legs run inside
  container_digests:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
    description: the ghcr manifest digest per (container x arch) — the pin's immutable half (ruby#381)
  link_unit_release:
    type: string
    pattern: '^v\d+\.\d+\.\d+$'
    description: the tamatebako/tebako release whose published link unit + tfs CLI the legs consume
  macos_deployment_target:
    type: string
    # The macOS support floor stamped into the exe's LC_BUILD_VERSION
    # minos — a product decision, never the runner image's accident
    # (tebako-runtime-python#81).
    pattern: '^\d+\.\d+$'
    description: the macOS support floor for the macOS legs (MACOSX_DEPLOYMENT_TARGET), uniform across arches and asserted at the provenance gate
  release_tooling:
    type: string
    pattern: '^v\d+\.\d+\.\d+$'
    description: the tamatebako/tebako-release-tooling tag the Gemfile pins (the release machinery's single owner; consumed by the publish/sign legs and the coordinator's audit)
  r:
    type: object
    required: [catalog, full, tidy]
    additionalProperties: false
    properties:
      catalog:
        $ref: '#/$defs/versions'
      full:
        $ref: '#/$defs/versions'
      tidy:
        $ref: '#/$defs/versions'
$defs:
  versions:
    type: array
    items:
      type: string
      # The line grammar's owner is RVersion::LINE_PATTERN
      # (build/lib/tebako_r_builder/r_version.rb): plain x.y.z. This
      # pattern mirrors it; the lint gate validates the catalog against
      # both.
      pattern: '^\d+\.\d+\.\d+$'
    uniqueItems: true
